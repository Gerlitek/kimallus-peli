# Front: type check, unit tests, production build and deploy to the web host.
# Pushes and pull requests only build and test. The deploy runs only when the owner
# starts the workflow by hand on main (Actions > web > Run workflow, or `gh workflow run web`).
# The deploy uses the environment "production": the owner approves the run before it starts.
# Interim host: gerlitek shared hosting over SSH + rsync. S3 + CloudFront replaces it in stage 2.
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', 'api/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'shared/**', 'api/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Never cancel a running deploy halfway. Only superseded pull request builds are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # runs tsc --noEmit first
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true # without this .htaccess is left out of the artifact
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - name: Install the deploy key and the pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # Pinned fingerprint SHA256:iO596IX5WjAaAsu9r19P8b4KFznagt4G425dg4gC4rc.
          # If the host key changes, the deploy fails instead of trusting a stranger.
          echo 'gerlitek.fi ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBikwALrcmKz8x5xbtpWY/UxZ8/XPem34cluLcb0eBGe' > ~/.ssh/known_hosts
      - name: Check the build before it replaces the live site
        run: test -f dist/index.html && test -f dist/.htaccess && test -f dist/tilastot/index.html
      - name: Sync to the web host
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        # The key is restricted on the server (rrsync), so "./" is the game's public folder.
        # --delete removes files from older builds, such as old hashed JS files.
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@gerlitek.fi:./"
