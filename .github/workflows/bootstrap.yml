# Terraform account baseline (infra-bootstrap/): format and validate only.
# No AWS credentials here on purpose. The owner runs plan and apply by hand,
# so the deploy role can never change its own permissions.
name: bootstrap

on:
  push:
    branches: [main]
    paths: ['infra-bootstrap/**', '.github/workflows/bootstrap.yml']
  pull_request:
    paths: ['infra-bootstrap/**', '.github/workflows/bootstrap.yml']

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
