<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tilastot · Kimallus</title>
  <meta name="description" content="Kimallus lukuina: pelikerrat, hypyt ja esteet." />
  <style>
    :root {
      --bg: #0F1115; --surface-1: #151923; --surface-2: #1B2030; --border: #252D3F;
      --text: #E7E8EA; --text-dim: #A9AFBA; --brand: #E85AA5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 16px; color: var(--text);
      background:
        radial-gradient(60% 45% at 0% 0%, rgba(232, 90, 165, 0.16), transparent 70%),
        radial-gradient(55% 45% at 100% 100%, rgba(232, 90, 165, 0.13), transparent 70%),
        var(--bg);
      border-top: 2px solid transparent;
      border-image: linear-gradient(90deg, transparent, rgba(232, 90, 165, 0.45) 30%, rgba(232, 90, 165, 0.45) 70%, transparent) 1;
      font-family: Inter, system-ui, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 8px 0 4px; }
    h1 { margin: 0; font-size: 1.6rem; color: var(--brand); }
    header a { color: var(--text-dim); font-size: 0.85rem; text-decoration: none; }
    header a:hover { color: var(--brand); }
    .lead { margin: 0 0 18px; color: var(--text-dim); font-size: 0.85rem; }
    .status.demo { margin-bottom: 12px; padding: 10px 14px; border-color: rgba(255, 201, 74, 0.5); color: #ffc94a; font-size: 0.82rem; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .tile b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .tile span { font-size: 0.78rem; color: var(--text-dim); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; min-width: 0; }
    .card.wide { grid-column: 1 / -1; }
    .card h2 { margin: 0 0 12px; font-size: 0.95rem; font-weight: 600; }
    /* A bar row: label, bar, number. The number is always there as text. */
    .bars { list-style: none; margin: 0; padding: 0; }
    .bar { display: grid; grid-template-columns: minmax(6.5em, 30%) 1fr auto; align-items: center; gap: 10px; margin: 7px 0; font-size: 0.8rem; }
    .bar .label { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .track { display: block; height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
    .bar .track i { display: block; height: 100%; border-radius: 6px; }
    .bar .value { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty { color: var(--text-dim); font-size: 0.85rem; margin: 0; }
    footer { margin-top: 28px; font-size: 0.7rem; color: rgba(169, 175, 186, 0.6); }
    @media (max-width: 720px) {
      .tiles { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
    .status { padding: 24px; text-align: center; color: var(--text-dim); background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Tilastot</h1>
      <a href="../">← Takaisin peliin</a>
    </header>
    <p class="lead">Kimallus lukuina. Luvut lasketaan kerran yössä nimettömistä pelitapahtumista. Pelinimiä ei tallenneta tilastoihin.</p>
    <div id="stats"></div>
  </main>
  <script type="module" src="../src/stats/main.tsx"></script>
</body>
</html>
